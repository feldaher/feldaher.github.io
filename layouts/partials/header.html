<header class="site-header">
  <nav class="nav" aria-label="Main">
    <a class="nav-name" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    <ul class="nav-links">
      {{ $current := . }}
      {{ range .Site.Menus.main }}
      {{ $active := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (hasPrefix $current.RelPermalink .URL) }}
      <li><a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
