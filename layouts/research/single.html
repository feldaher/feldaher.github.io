{{ define "main" }}
<article class="page">
  <header class="page-header">
    <p class="post-meta"><a href="{{ "/research/" | relURL }}">Research</a></p>
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Params.summary }}<p class="page-lede">{{ . }}</p>{{ end }}
  </header>
  {{ with .Resources.GetMatch "featured.*" }}
  <figure class="feature">
    <img src="{{ .RelPermalink }}" alt="{{ $.Params.image.caption }}">
    {{ with $.Params.image.caption }}<figcaption>{{ . }}</figcaption>{{ end }}
  </figure>
  {{ end }}
  <div class="prose">{{ .Content }}</div>
  {{ with .Params.tags }}<p class="tags">{{ range . }}<span>{{ . }}</span>{{ end }}</p>{{ end }}
</article>
{{ end }}
