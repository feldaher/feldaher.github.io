{{ define "main" }}
<section class="page page--wide">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Content }}<div class="page-lede">{{ . }}</div>{{ end }}
  </header>
  <div class="project-list">
    {{ range .Pages.ByWeight }}
    <a class="project" href="{{ .RelPermalink }}">
      {{ with .Resources.GetMatch "featured.*" }}
      <img class="project-img" src="{{ .RelPermalink }}" alt="" loading="lazy">
      {{ else }}
      <div class="project-img project-img--empty" aria-hidden="true"></div>
      {{ end }}
      <div class="project-body">
        <h2 class="project-title">{{ .Title }}</h2>
        <p class="project-summary">{{ .Params.summary }}</p>
        {{ with .Params.tags }}<p class="tags">{{ range . }}<span>{{ . }}</span>{{ end }}</p>{{ end }}
      </div>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
