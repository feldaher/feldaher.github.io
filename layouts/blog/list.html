{{ define "main" }}
<section class="page">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Content }}<div class="page-lede">{{ . }}</div>{{ end }}
  </header>
  <ul class="post-list">
    {{ range .Pages.ByDate.Reverse }}{{ partial "post_item.html" . }}{{ end }}
  </ul>
</section>
{{ end }}
