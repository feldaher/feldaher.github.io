title: Francois El-Daher
baseURL: "https://feldaher.github.io/"
languageCode: "en-us"
theme: [] # No theme, using custom layouts

enableEmoji: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
  tag: tags

disableKinds: ["taxonomy", "term"]

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["$$", "$$"]]
          inline: [["\\(", "\\)"]]
